services:
  advaders:
    build: .
    image: ghcr.io/milouk/advaders:latest
    container_name: advaders
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-3000}:3000"
    environment:
      # ── server ────────────────────────────────────────────
      PORT: 3000
      HOST: 0.0.0.0
      TITLE: ${TITLE:-ADVADERS}

      # ── pi-hole connection (omit both → frontend demo) ────
      PIHOLE_URL: ${PIHOLE_URL:-}
      PIHOLE_PASSWORD: ${PIHOLE_PASSWORD:-}
      PIHOLE_INSECURE_TLS: ${PIHOLE_INSECURE_TLS:-false}
      PIHOLE_QUERY_LENGTH: ${PIHOLE_QUERY_LENGTH:-200}

      # ── client polling ────────────────────────────────────
      POLL_INTERVAL_MS: ${POLL_INTERVAL_MS:-2000}

      # ── client defaults ───────────────────────────────────
      DEFAULT_THEME: ${DEFAULT_THEME:-crt}
      DEFAULT_SPRITE: ${DEFAULT_SPRITE:-classic}
      DEFAULT_DENSITY: ${DEFAULT_DENSITY:-normal}
